<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Công Văn - Phân Hiệu UFM Quảng Ngãi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between">

    <!-- Header Banner -->
    <header class="bg-blue-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center">
            <div>
                <h1 class="text-xl font-bold uppercase tracking-wider">TRƯỜNG ĐẠI HỌC TÀI CHÍNH - MARKETING</h1>
                <p class="text-sm text-blue-200">PHÂN HIỆU TỈNH QUẢNG NGÃI – HỆ THỐNG QUẢN LÝ CÔNG VĂN</p>
            </div>
            <div class="mt-3 sm:mt-0 text-sm bg-blue-800 px-3 py-1.5 rounded-lg border border-blue-700">
                Trạng thái kết nối: <span id="firebase-status" class="font-semibold text-yellow-300">Đang kết nối Firebase...</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-sm p-8 border border-slate-200 text-center">
            <h2 class="text-4xl font-bold text-slate-800">Chào anh</h2>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        Phân hiệu Trường Đại học Tài chính - Marketing tại tỉnh Quảng Ngãi &copy; 2026
    </footer>

    <!-- Firebase SDK Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Cấu hình Firebase từ tài khoản của anh
        const firebaseConfig = {
            apiKey: "AIzaSyBYHI65OfrCJuHsT3xxU1iZEYemzq2MavM",
            authDomain: "qlcvphqn.firebaseapp.com",
            databaseURL: "https://qlcvphqn-default-rtdb.firebaseio.com",
            projectId: "qlcvphqn",
            storageBucket: "qlcvphqn.firebasestorage.app",
            messagingSenderId: "582716059830",
            appId: "1:582716059830:web:0de8e5b6f4507203d4f617",
            measurementId: "G-2SZ3MHXRMP"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getDatabase(app);
            
            // Kiểm tra kết nối nhanh tới Realtime Database
            const connectedRef = ref(db, ".info/connected");
            get(connectedRef).then(() => {
                document.getElementById('firebase-status').innerText = "Đã kết nối thành công Firebase!";
                document.getElementById('firebase-status').className = "font-semibold text-emerald-300";
            });
        } catch (error) {
            document.getElementById('firebase-status').innerText = "Lỗi kết nối Firebase";
            document.getElementById('firebase-status').className = "font-semibold text-red-300";
            console.error(error);
        }
    </script>
</body>
</html>
